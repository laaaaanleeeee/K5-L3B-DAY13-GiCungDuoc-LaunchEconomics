# Lab 13 · Nhiệm vụ D · Kế hoạch pilot trợ lý hoàn phí LogiX-VN (Gate 2a)
# Điền mọi chỗ có dấu hỏi. Khi nộp, ngoài các dòng chú thích không còn dấu hỏi nào.
# Kiểm tra đọc được: python -c "import yaml; yaml.safe_load(open('../report/team/pilot_plan.yaml'))"
#
# D1 · Cỡ mẫu (baseline 0,70; mục tiêu +5 điểm; alpha 0,05; power 0,8; ICC 0,02) — số từ src/lab13.py
#   a) Chia theo yêu cầu: 1.251 yêu cầu mỗi nhóm
#   b) Theo nhân viên, m = 75: DE = 1 + 74 × 0,02 = 2,48; n = 3.103 mỗi nhóm → 42 người mỗi nhóm, tổng 84 > 40 nhân viên: KHÔNG đủ người
#   c) 20 nhân viên mỗi nhóm: tối đa c / ICC = 20 / 0,02 = 1.000 < 1.251: KHÔNG đạt
#   d) 6 depot mỗi nhóm: tối đa 6 / 0,02 = 300
#   e) Mức chênh 6 điểm (859 mỗi nhóm), 20 nhân viên mỗi nhóm: m ≥ 299 yêu cầu mỗi người (DE 6,96)
#
# D2 · Năm câu kiểm tra "tách được tác động" với cách chia đã chọn (theo nhân viên, 20 + 20):
#   1. Đối chứng chạy cùng thời gian: Có, 20 nhân viên đối chứng làm cùng tuần, cùng depot với 20 nhân viên dùng trợ lý.
#   2. Chia ngẫu nhiên hay do người chọn: Ngẫu nhiên, bốc thăm bằng code với seed ghi trước, phân tầng theo depot.
#   3. Ảnh hưởng gián tiếp và cách giảm: Có rủi ro chia sẻ câu trả lời trong cùng depot; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id.
#   4. Chỉ số chính, ngưỡng, ngày quyết định đã viết trước: Có, chốt trong file này trước ngày bắt đầu 2026-12-01.
#   5. Ít nhất 20 cụm mỗi nhóm: Có, đúng 20 cụm (nhân viên) mỗi nhóm.
#
# Đánh đổi đã chấp nhận: với 40 nhân viên không cách chia theo cụm nào đủ mẫu cho mức chênh 5 điểm
#   (tối đa 1.000 < 1.251). Nhóm chấp nhận MDE 6 điểm (859 mỗi nhóm, m ≥ 299 yêu cầu mỗi nhân viên).
#   Nếu tác động thật chỉ là 5 điểm, power với n = 859 chỉ còn 0,64 (statsmodels NormalIndPower).
#   Khả thi về khối lượng: 1.500 yêu cầu/ngày × 81,8% thuộc phạm vi ÷ 40 nhân viên ≈ 31 yêu cầu/người/ngày → 299 cần khoảng 10 ngày làm việc ở bước 0,50.
#
# Tỉ lệ mo_lai_trong_7_ngay hiện tại và ngưỡng an toàn đã chọn:
#   Toàn bộ mẫu 4,25% (51/1.200); trong phạm vi noi_dia + hang_nang 3,97% (39/982).
#   Ngưỡng: nhóm trợ lý cao hơn đối chứng ≥ 2 điểm, hoặc vượt trần tuyệt đối 6%. Không đặt 3% tuyệt đối vì sẽ dừng ngay tuần đầu.

pilot:
  owner: "Giám đốc vận hành LogiX-VN"
  scope: "Chỉ noi_dia và hang_nang tại 6 depot đang chạy thử (0,22× và 0,69× so với 12.000 đ, simulated; cả phạm vi 0,38× khi cộng chi phí cố định, simulated). Loại quoc_te (1,88×, thành công 27,3%) và doi_tac (0,85×, điều khoản riêng)"
  assignment:
    unit: "staff"
    control_share: 0.5
    randomized: true
  rollout: [0.10, 0.25, 0.50]     # mỗi bước một tuần; 4 → 10 → 20 nhân viên; chỉ đo chỉ số chính từ bước 0.50
  primary_metric:
    name: dong_trong_24h_khong_mo_lai_7_ngay
    baseline: 0.70
    mde: 0.06                     # đánh đổi đã chấp nhận (5 điểm không đủ mẫu với 40 nhân viên)
    alpha: 0.05
    power: 0.80
    n_per_arm: 859
    design_effect: 6.96
    clusters_per_arm: 20
  identifiability:
    concurrent_control: "Có: 20 nhân viên đối chứng làm cùng thời gian, cùng depot, chia ngẫu nhiên phân tầng theo depot với seed ghi trước"
    spillover_risk: "Trung bình: nhân viên trong cùng depot có thể chia sẻ câu trả lời của trợ lý; giảm bằng quyền truy cập theo tài khoản và log lượt mở trợ lý theo staff_id, loại khỏi phân tích nếu đối chứng có lượt mở"
    predeclared: "Có: chỉ số chính, MDE 0,06, ba luật dừng và ngày quyết định 2027-01-05 chốt trước ngày bắt đầu 2026-12-01"
  stop_rules:
    - "NẾU tỉ lệ mở lại 7 ngày của nhóm trợ lý cao hơn đối chứng ≥ 2 điểm hoặc vượt 6% (hiện tại 3,97% trong phạm vi), hoặc có ≥ 1 ca hoàn trùng TRONG 3 ngày liên tiếp THÌ Giám đốc vận hành tắt trợ lý trong 30 phút và chuyển toàn bộ về nhân viên tự làm KHÔNG THÌ không được sang bước rollout tiếp theo"
    - "NẾU chi phí mỗi việc thành công trong phạm vi > 8.000 đ (0,67× của 12.000 đ, simulated; mức hiện tại 4.599 đ) TRONG 2 tuần liên tiếp THÌ PM trợ lý hoàn phí thu hẹp về noi_dia và giới hạn 2 lần chạy KHÔNG THÌ không được mở thêm hang_nang hay depot mới"
    - "NẾU tỉ lệ nhân viên bỏ qua gợi ý của trợ lý > 40% TRONG 1 tuần THÌ Trưởng nhóm CSKH phỏng vấn 5 nhân viên trong 3 ngày và báo cáo lý do KHÔNG THÌ không được chuyển sang bước rollout tiếp theo"
  interim_looks: "chỉ kiểm tra chỉ số an toàn"
  rollback: "Giám đốc vận hành bấm cờ tắt trợ lý, hiệu lực trong 30 phút; khách được phục vụ bằng luồng nhân viên tự làm như trước pilot"
  decision_date: "2027-01-05"
  simulated_inputs:
    - "phut_xem_lai_simulated"
    - "phut_lam_lai_simulated"
    - "chi phí mỗi việc thành công theo loại: noi_dia 2.696 đ (0,22×), hang_nang 8.221 đ (0,69×), quoc_te 22.515 đ (1,88×), doi_tac 10.215 đ (0,85×)"
    - "chi phí mỗi việc thành công trong phạm vi cộng chi phí cố định: 4.599 đ (0,38×)"
    - "ngưỡng chi phí dừng 8.000 đ"
